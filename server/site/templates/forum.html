<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - {{site}}</title>
<link rel="canonical" href="{{canonical}}">
<script src="/words.js?l={{langcode}}&amp;v={{v}}"></script>
<script src="/static/words.js?v={{v}}"></script>
<script src="/static/theme.js?v={{v}}"></script>
<link rel="stylesheet" href="/static/site.css?v={{v}}">
<link rel="stylesheet" href="/static/editor.css?v={{v}}">
<link rel="stylesheet" href="/static/forum.css?v={{v}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{icon32}}">
<link rel="apple-touch-icon" href="{{icon180}}">
<meta name="theme-color" content="#0f1720">
</head>
<body class="forum sided {{who}}">
<div class="shell">
<aside class="siteside">
  <input type="checkbox" id="sidetoggle" class="sidetoggle">
  <div class="sidehead">
    <a class="brand" href="/">{{brand}}</a>
    <button type="button" id="theme" class="iconbtn" title="{{t:Theme: auto}}"></button>
    <label for="sidetoggle" class="sidemenu">{{t:Menu}}</label>
  </div>
  <div class="sidebody">
    <nav class="sidenav" aria-label="{{t:Site}}">{{nav}}</nav>
    <nav class="sidelist" aria-label="{{t:Forum}}">
      <div class="group">{{t:Forum}}</div>
      <a class="room" href="/forum">{{t:Board index}}</a>
      <a class="room member-only" href="/forum/recent">{{t:Recent posts}}</a>
      <a class="room member-only" href="/forum/unread">{{t:Unread posts}}</a>
      <a class="room member-only" href="/forum/following">{{t:Topics you follow}}</a>
      {{signature_link}}
      {{reports_link}}
    </nav>
    <div id="side-language" hidden>{{language_form}}</div>
    {{powered}}
    <div id="account" class="account">{{account}}</div>
  </div>
</aside>
<div class="shellmain">
<main class="forum-main" id="forum-top">
  <div class="partbar"><form class="site-search" action="/search" method="get" role="search"><input type="search" name="q" maxlength="100" required placeholder="{{t:Search the forum}}" aria-label="{{t:Search the forum}}"><input type="hidden" name="in" value="forum"><button>{{t:Search}}</button></form></div>{{search_offers}}
  {{heading}}
  {{content}}
  <noscript><p>{{t:JavaScript is needed to post or change the forum.}}</p></noscript>
  <div id="forum-bottom"></div>
</main>
</div>
</div>
<script src="/static/keys.js?v={{v}}"></script>
<script src="/static/side.js?v={{v}}"></script>
<script src="/static/emoji-names.js?v={{v}}"></script>
<script src="/static/editor.js?v={{v}}"></script>
<script src="/static/reactions.js?v={{v}}"></script>
<script src="/static/forum.js?v={{v}}"></script>
{{live}}
<script src="/static/live.js?v={{v}}"></script>
</body>
</html>
