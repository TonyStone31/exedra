<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - {{site}}</title>
<script src="/words.js?l={{langcode}}&amp;v={{v}}"></script>
<script src="/static/words.js?v={{v}}"></script>
<script src="/static/theme.js?v={{v}}"></script>
<link rel="stylesheet" href="/static/site.css?v={{v}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{icon32}}">
<link rel="apple-touch-icon" href="{{icon180}}">
<meta name="theme-color" content="#0f1720">
</head>
<body class="home guest">
<header class="topbar">
  <a class="brand" href="/">{{brand}}</a>
  {{language_form}}
</header>
<section class="signin">
  <h1>{{t:Set your password}}</h1>
  <p>{{password_for}} {{t:This link works once.}}</p>
  <form class="quickjoin stacked newpassword" data-token="{{token}}" data-name="{{name}}">
    <input name="username" value="{{name}}" autocomplete="username" readonly>
    <input name="password" type="password" placeholder="{{t:New password, 8 characters or more}}" autocomplete="new-password" required>
    <button>{{t:Set it}}</button>
  </form>
  <p class="fine">{{t:Your password never leaves your browser.}} {{t:It also locks the key for your private messages, so messages sent to you before this password cannot be read with it.}}</p>
</section>
<script src="/static/keys.js?v={{v}}"></script>
<script src="/static/home.js?v={{v}}"></script>
</body>
</html>
